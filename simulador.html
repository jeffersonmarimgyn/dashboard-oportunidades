<!DOCTYPE html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="google" content="notranslate">
<title>Simulador RV · Oportunidades</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --paper:#EEF3F9; --sheet:#FFFFFF; --ink:#0D2847; --muted:#5A6B80; --line:#D2DCE8;
  --fc:#C98A12; --fc-soft:#FDF4DF; --fcb:#EED9A6; --fct:#8A5A00; --fc-on:#FFFFFF; --pp:#7C3AED; --pp-soft:#F0E9FE; --tt:#8497AE; --tt-soft:#E3E9F0;
  --warn:#B4432F; --warn-soft:#F6DED8; --band:#0A2D57; --band-ink:#FFFFFF;
  --won:#059669; --scc:#0E7490; --ad:#2563EB; --ad-soft:#E1EAFD; --im:#DB2777; --im-soft:#FCE4EF; --rr:#059669; --rr-soft:#D9F4EA;
  --ad-on:#DBE7FF; --im-on:#FFE0EE; --rr-on:#D3F8E8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1522; --sheet:#132033; --ink:#E4ECF6; --muted:#98A8BC; --line:#23344B;
  --fc:#E8B54A; --fc-soft:#27210F; --fcb:#5E4B17; --fct:#F2CC73; --fc-on:#27210F; --pp:#A78BFA; --pp-soft:#2A2147; --tt:#8FA2B8; --tt-soft:#1F2D3F;
  --warn:#E57B64; --warn-soft:#3C231D; --band:#06182F; --band-ink:#FFFFFF;
  --won:#34D399; --scc:#22D3EE; --ad:#60A5FA; --ad-soft:#15294A; --im:#F472B6; --im-soft:#3B1830; --rr:#34D399; --rr-soft:#123A2C;
  --ad-on:#DBE7FF; --im-on:#FFE0EE; --rr-on:#D3F8E8;}}
:root[data-theme="dark"]{
  --paper:#0C1522; --sheet:#132033; --ink:#E4ECF6; --muted:#98A8BC; --line:#23344B;
  --fc:#E8B54A; --fc-soft:#27210F; --fcb:#5E4B17; --fct:#F2CC73; --fc-on:#27210F; --pp:#A78BFA; --pp-soft:#2A2147; --tt:#8FA2B8; --tt-soft:#1F2D3F;
  --warn:#E57B64; --warn-soft:#3C231D; --band:#06182F; --band-ink:#FFFFFF;
  --won:#34D399; --scc:#22D3EE; --ad:#60A5FA; --ad-soft:#15294A; --im:#F472B6; --im-soft:#3B1830; --rr:#34D399; --rr-soft:#123A2C;
  --ad-on:#DBE7FF; --im-on:#FFE0EE; --rr-on:#D3F8E8;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.band{background:var(--band);color:var(--band-ink)}
.band .inner{max-width:1180px;margin:0 auto;padding:22px 20px 24px}
.band header.top{margin-bottom:0}
.band .sub{color:rgba(255,255,255,.72)}
.brand{display:flex;align-items:center;gap:16px}
.brand img{height:40px;width:auto;display:none}
.brand img.on{display:block}
.brand .div{width:1px;align-self:stretch;background:rgba(255,255,255,.28);display:none}
.brand img.on + .div{display:block}
.band select{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
.band select option{color:#0D2847}
.band .upload{background:#fff;color:var(--band);border-color:#fff}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
h1{font-size:34px;font-stretch:112%;font-weight:750;letter-spacing:-.01em;margin:0;line-height:1.05}
.sub{color:var(--muted);margin-top:6px;font-size:14px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,button,.upload{font:inherit;font-size:14px;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.upload{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.upload input{display:none}
:focus-visible{outline:3px solid #2F7BEA;outline-offset:2px}
.msg{margin:-12px 0 20px;padding:10px 14px;border-radius:8px;font-size:14px;display:none}
.msg.ok{display:block;background:var(--rr-soft)} .msg.err{display:block;background:var(--warn-soft);color:var(--warn)}

/* quadro do executivo */
.board{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:22px}
.board h2{margin:0 0 4px;font-size:24px;font-weight:750;font-stretch:110%}
.board h2 small{font-size:14px;font-weight:500;color:var(--muted);font-stretch:100%;margin-left:6px}
.board .leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:4px 0 18px}
.board .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{font:inherit;color:var(--ink);text-align:left;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--tt);border-radius:10px;padding:14px 14px 12px;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tile:hover{border-color:var(--ink);border-top-color:inherit}
.tile.fc{border-top-color:var(--fc);background:var(--fc-soft)} .tile.pp{border-top-color:var(--pp);background:var(--pp-soft)}
.tile .an{font-weight:650;font-size:14.5px;line-height:1.25}
.tile .am{font-size:12px;color:var(--muted)}


/* horizontes */
.horizons{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:14px;margin-bottom:30px;align-items:stretch}
.hz{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;text-align:left;cursor:pointer;border-top:5px solid var(--c);transition:box-shadow .15s}
.hz[aria-pressed="true"]{box-shadow:0 0 0 2px var(--c)}
.hz.fc{--c:var(--fc)} .hz.pp{--c:var(--pp)} .hz.tt{--c:var(--tt)}
.hz.pp{background:var(--pp-soft);border-color:var(--pp)}
.hz.pp .name{color:var(--pp)}
.hz.fc{background:var(--fc-soft);border-color:var(--fcb);border-top-color:var(--fc);padding:22px 22px 18px}
.hz.fc .name{color:var(--fct)}
.hz.fc .name{font-size:22px}
.hz.fc .tag{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:650;background:var(--fc);color:var(--fc-on);border-radius:20px;padding:2px 9px;vertical-align:4px;font-stretch:100%}
.hz .name{font-size:18px;font-weight:700;font-stretch:108%}
.hz .rule{font-size:12.5px;color:var(--muted);margin:2px 0 14px}
.hz .counts{font-size:13px;color:var(--muted);margin-bottom:12px}
.hz .counts b{color:var(--ink);font-size:20px;font-weight:700;margin-right:3px}
.vals{display:grid;gap:6px}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;border-top:1px dashed var(--line);padding-top:6px}
.vrow span{color:var(--muted);display:flex;align-items:center;gap:7px} .vrow b{font-weight:700;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-ad{background:var(--ad)} .d-im{background:var(--im)} .d-rr{background:var(--rr)} .d-scc{background:var(--scc)}
.v-ad{color:var(--ad)} .v-im{color:var(--im)} .v-rr{color:var(--rr)} .v-scc{color:var(--scc)}
.hz.fc .vrow b{font-size:16px}
th.h-ad{color:var(--ad)} th.h-im{color:var(--im)} th.h-rr{color:var(--rr)} th.h-scc{color:var(--scc)}
.fcol{background:var(--fc-soft)}

/* seções */
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;margin-bottom:22px}
section.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
section.card h3{margin:0 0 4px;font-size:17px;font-weight:700;font-stretch:106%}
section.card .desc{color:var(--muted);font-size:13px;margin-bottom:14px}
.funnel .row{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.funnel .track{height:18px;background:var(--paper);border-radius:4px;overflow:hidden;display:flex}
.funnel .track i{display:block;height:100%}
.funnel .row{position:relative;border-radius:6px}
.funnel .row:not(.head):hover,.funnel .row:focus-visible{background:var(--paper)}
.funnel .row.head{font-size:11.5px;color:var(--muted);padding-bottom:2px}
.funnel .row.head div:last-child{text-align:right;line-height:1.25}
.tip{display:none;position:absolute;z-index:5;right:0;top:calc(100% + 4px);width:310px;background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tip b{display:block;font-size:13.5px} .tip>span{display:block;opacity:.75;font-size:12px;margin-bottom:8px}
.tip .tl{display:flex;align-items:center;gap:7px;padding:3px 0} .tip .tl em{margin-left:auto;font-style:normal;font-weight:650}
.tip .tl i{width:9px;height:9px;border-radius:2px;display:inline-block;outline:1px solid rgba(255,255,255,.35)}
.tip .tl.sep{border-top:1px solid rgba(255,255,255,.2);margin-top:4px;padding-top:6px;opacity:.85}
.funnel .row:hover .tip,.funnel .row:focus .tip{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.c-ad{background:var(--ad)} .c-im{background:var(--im)} .c-mr{background:var(--rr)} .c-scc{background:var(--scc)}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 12px;border-radius:0 8px 8px 0;margin-bottom:8px;font-size:13.5px}
.alerts li b{display:block;font-size:13px;color:var(--warn);margin-bottom:2px}
.alerts .ok{border-left-color:var(--rr);background:var(--rr-soft)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.acc{cursor:pointer} tr.acc:hover td{background:var(--paper)}
tr.det td{background:var(--paper);font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:20px;background:var(--tt-soft);white-space:nowrap}
.pill.hi{background:var(--fc-soft);color:var(--fct);font-weight:600}
.search{width:100%;max-width:320px;margin-bottom:10px;font:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
footer{color:var(--muted);font-size:12.5px;margin-top:26px}
@media (max-width:860px){.horizons{grid-template-columns:1fr}.hz.fc{order:-1}.grid2{grid-template-columns:1fr}.funnel .row{grid-template-columns:110px 1fr 90px}h1{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.band .ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.band .upload{display:inline-block}
.meta{font-size:12.5px;color:var(--muted);margin:-2px 0 14px}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center;color:var(--muted);margin-bottom:22px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;background:var(--band);padding:20px}
#login form{background:var(--sheet);border-radius:16px;padding:30px 28px;width:100%;max-width:380px;display:grid;gap:14px}
#login h1{font-size:26px} #login p{margin:0;color:var(--muted);font-size:14px}
#login label{display:grid;gap:5px;font-size:13px;font-weight:600}
#login input,.dlg select{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.primary{background:var(--band)!important;color:#fff!important;border-color:var(--band)!important;font-weight:650}
.danger{color:var(--warn)!important;border-color:var(--warn)!important;background:transparent!important}
#loginErr{color:var(--warn);font-size:13.5px;min-height:1em}
/* diálogos */
dialog.dlg{border:0;border-radius:16px;padding:0;width:min(720px,94vw);max-height:88vh;background:var(--sheet);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.dlg::backdrop{background:rgba(6,20,40,.55)}
.dlg .hd{padding:20px 22px 6px} .dlg .hd h3{margin:0;font-size:19px} .dlg .hd p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.dlg .bd{padding:10px 22px;overflow:auto;max-height:58vh}
.dlg .ft{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dlg ul.files{margin:0 0 10px;padding-left:18px;font-size:13.5px;color:var(--muted)}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--tt-soft);color:var(--muted)}
.badge.undo{background:var(--warn-soft);color:var(--warn)} .badge.clean{background:var(--pp-soft);color:var(--ink)}
.row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.hidden{display:none!important}

/* por executivo */
.xrow{display:grid;grid-template-columns:230px 1.2fr 1fr 1fr;gap:12px;align-items:stretch;padding:14px;border:1px solid transparent;border-top-color:var(--line)}
.xrow:first-child{border-top-color:transparent}
.xrow.team{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.xrow.team + .xrow{border-top:0}
.xwho{display:flex;gap:12px;align-items:center;min-width:0}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:#2F7BEA;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.02em}
.xrow.team .av{background:var(--pp);font-size:18px}
.xwho b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.xwho small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.xh{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sheet);border-left:4px solid var(--c)}
.xh.fc{--c:var(--fc);background:var(--fc-soft);border-color:var(--fcb);border-left-color:var(--fc)}
.xh.fc .xt b{color:var(--fct)}
.xh.pp{--c:var(--pp);background:var(--pp-soft);border-color:var(--pp)} .xh.tt{--c:var(--tt)}
.xt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.xt b{font-size:13.5px;font-weight:700;color:var(--c)}
.xt em{font-style:normal;font-size:12px;color:var(--muted)}
.xv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
.xv span{display:flex;align-items:center;gap:6px;color:var(--muted)}
.xv strong{font-weight:700}

.xshare{margin-top:7px;font-size:11.5px;color:var(--muted)}
.xbar{height:4px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.xbar i{display:block;height:100%;background:var(--c)}
@media (max-width:1000px){.xrow{grid-template-columns:1fr 1fr 1fr}.xwho{grid-column:1/-1}}
@media (max-width:640px){.xrow{grid-template-columns:1fr}}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.filters .fl{font-size:13px;font-weight:650;color:var(--muted);margin-right:2px}
.chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s}
.chip:hover{border-color:#2F7BEA;color:var(--ink)}
.chip.on{background:#2F7BEA;border-color:#2F7BEA;color:#fff;font-weight:650;box-shadow:0 2px 8px rgba(47,123,234,.35)}
.chip.on::before{content:"✓";font-weight:800}
.chip.all.on{background:#0E9F6E;border-color:#0E9F6E;box-shadow:0 2px 8px rgba(14,159,110,.35)}
.pcount{font-size:12.5px;color:var(--muted);margin-left:4px}
.pcount b{color:var(--ink)}
.chip.clear{border-color:var(--warn);color:var(--warn);background:transparent}
.fsum{font-size:13px;color:var(--muted);margin-left:8px}
.fsum b{color:var(--ink)}
.hz .hint{margin-top:10px;font-size:11.5px;color:var(--muted)}
.hz[aria-pressed="true"] .hint{font-weight:650}
.hz[aria-pressed="true"]{box-shadow:0 0 0 3px var(--c), 0 6px 18px rgba(0,0,0,.18)}

/* filtro de data */
.fsep{width:1px;height:22px;background:var(--line);margin:0 6px}
.dwrap{position:relative;display:inline-flex;align-items:center;gap:8px}
.dbtn{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;display:inline-flex;gap:10px;align-items:center;min-width:150px;justify-content:space-between}
.dbtn i{font-style:normal;color:var(--muted)}
.dbtn.on{border-color:#2F7BEA;background:#2F7BEA;color:#fff;font-weight:650}
.dbtn.on i{color:#fff}
.dpop{position:absolute;top:calc(100% + 6px);left:0;z-index:20;width:270px;max-height:340px;overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:8px 6px}
.drow{display:flex;align-items:center;gap:2px;padding:1px 0}
.drow.l2{padding-left:20px} .drow.l3{padding-left:40px}
.tw{font:inherit;width:22px;height:22px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:4px;display:inline-grid;place-items:center;font-size:15px;transition:transform .12s;flex:none;padding:0}
.tw.open{transform:rotate(90deg)} .tw.sp{cursor:default}
.tw:not(.sp):hover{background:var(--paper)}
.dn{display:flex;align-items:center;gap:8px;flex:1;font-size:13.5px;padding:5px 6px;border-radius:6px;cursor:pointer}
.dn:hover{background:var(--paper)}
.dn input{width:16px;height:16px;accent-color:#2F7BEA;margin:0;cursor:pointer}
.dn.b span{font-weight:650}
.dn em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--muted)}

/* metas */
.mrow{display:grid;grid-template-columns:250px 1fr;gap:16px;padding:14px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow.team{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.mrow.team + .mrow{border-top:0}
.mrow .xwho{align-items:flex-start}
.mrow .xwho>div{min-width:0}
.rank{font-size:12px;font-weight:700;color:var(--muted);width:22px;flex:none;padding-top:12px}
.mmed{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px}
.mmed.ok,.mst.ok{background:#D1FAE5;color:#065F46} .mmed.at,.mst.at{background:#FEF3C7;color:#92400E} .mmed.rk,.mst.rk{background:#FEE2E2;color:#991B1B} .mmed.sm,.mst.sm{background:var(--tt-soft);color:var(--muted)}
.mvs{display:grid;gap:10px;min-width:0}
.mv{display:grid;grid-template-columns:120px 1fr 290px;gap:12px;align-items:center}
.mvl{display:flex;align-items:center;gap:7px;font-size:13.5px}
.mvl b{font-weight:650;display:block}
.mmeta{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.mbar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mr.ok{background:#059669} .mr.nm{background:var(--tt)} .mf.nm{background:repeating-linear-gradient(45deg,rgba(128,140,160,.55) 0 4px,rgba(128,140,160,.25) 4px 8px)} .fora{color:var(--muted);font-style:italic} .mr.at{background:#D97706} .mr.rk{background:#DC2626} .mr.sm{background:var(--tt)}
.mf{background:repeating-linear-gradient(45deg,rgba(47,123,234,.55) 0 4px,rgba(47,123,234,.3) 4px 8px)}
.mp{background:radial-gradient(circle,var(--tt) 35%,transparent 40%) 0 0/6px 6px}
.mvt{font-size:12px;color:var(--muted);margin-top:4px} .mvt b{color:var(--ink)}
.mvn{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.mst{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.mvn small{font-size:12px;color:var(--muted)} .mvn small b{color:var(--ink);font-weight:650} .falta{color:var(--warn);font-weight:650}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mmed.ok,:root:not([data-theme="light"]) .mst.ok{background:#064E3B;color:#6EE7B7}
 :root:not([data-theme="light"]) .mmed.at,:root:not([data-theme="light"]) .mst.at{background:#451A03;color:#FCD34D}
 :root:not([data-theme="light"]) .mmed.rk,:root:not([data-theme="light"]) .mst.rk{background:#450A0A;color:#FCA5A5}}
@media (max-width:1000px){.mrow{grid-template-columns:1fr}.mv{grid-template-columns:110px 1fr}.mvn{grid-column:1/-1;align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap;gap:8px}}

/* projeções */
:root{--c-ad:var(--ad);--c-im:var(--im);--c-rr:var(--rr);--c-scc:var(--scc)}
.pjbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.pjhd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}.pjhd b{font-weight:700;font-size:14.5px}.pjhd span{font-size:12px;color:var(--muted)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gc{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:center}
.gc h4{margin:0 0 2px;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.gbig{font-size:22px;font-weight:750;margin-top:-6px} .gsub{font-size:11.5px;color:var(--muted)}
.gnone{font-size:12.5px;color:var(--muted);padding:26px 0 10px}
.kv{display:grid;grid-template-columns:1fr auto;gap:1px 8px;font-size:12px;color:var(--muted);text-align:left;margin-top:6px}.kv b{color:var(--ink);font-weight:650;text-align:right}
.pj2{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:12px;margin-top:12px}
.dleg{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}.dleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}.dleg b{color:var(--ink)}
.chips-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.pj2{grid-template-columns:1fr}}

/* situação */
.tile.gw{border-top-color:var(--won);background:var(--rr-soft)}
.pill.won{background:var(--rr-soft);color:var(--won);font-weight:700}
.chip.seg.on{background:#0E9F6E;border-color:#0E9F6E}

/* usuários */
.uform{display:grid;grid-template-columns:1.6fr 1.2fr 1.2fr 1.2fr auto;gap:10px;align-items:end;margin-bottom:10px}
.uform label{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.uform input,.uform select,#uTbl input,#uTbl select{font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0}
.umsg{font-size:13px;min-height:1.2em;margin-bottom:8px}.umsg.ok{color:var(--won)}.umsg.err{color:var(--warn)}
#uTbl td{vertical-align:middle}#uTbl .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}#uTbl .acts button{font-size:12.5px;padding:5px 9px}
.ppf{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px}.ppf.dono{background:var(--band);color:#fff}.ppf.usuario{background:var(--pp-soft);color:var(--pp)}.ppf.vendedor{background:var(--fc-soft);color:var(--fct)}.ppf.nenhum{background:var(--warn-soft);color:var(--warn)}
.ucods{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.ucods .chip{font-size:12px;padding:4px 10px}.uhint{font-size:11.5px;color:var(--muted);margin-right:4px}.uadd{font:inherit;font-size:12px;padding:4px 8px;border:1px dashed var(--line);border-radius:20px;background:transparent;color:var(--ink)}
@media (max-width:860px){.uform{grid-template-columns:1fr 1fr}}

/* filtro de executivos */
.ewrap{position:relative}
.ebtn{font:inherit;font-size:14px;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:inline-flex;gap:10px;align-items:center;min-width:220px;justify-content:space-between}
.ebtn i{font-style:normal;opacity:.8}
.ebtn.on{background:#2F7BEA;border-color:#2F7BEA;font-weight:650}
#execPop{width:320px;color:var(--ink)}
.ebusca{width:100%;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);margin-bottom:6px}

/* simulador RV */
.rvctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;margin-bottom:10px}
.rvctl label,.rvreg label{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.rvctl select,.rvctl input,.rvreg input,.rvtab input{font:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0}
.rvfixo{display:flex;gap:6px}.rvfixo input{flex:1}.rvfixo button{padding:6px 10px}
.rvchk{display:flex!important;grid-template-columns:none;align-items:center;gap:8px;font-weight:500!important}
.rvreg{margin:0 0 12px;font-size:13px}.rvreg summary{cursor:pointer;font-weight:650;margin-bottom:8px}
#rvRegras{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
#rvRegras h5{grid-column:1/-1;margin:4px 0 0;font-size:12.5px}
.rvcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:6px 0 14px}
.rvcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.rvcard span{display:block;font-size:11.5px;color:var(--muted)}.rvcard b{display:block;font-size:17px;margin-top:3px}
.rvcard.dest{border-color:var(--fc);background:var(--fc-soft)}.rvcard.dest b{color:var(--fct)}
.rvmeses{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:10px}
.rvtab{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--sheet);min-width:0}
.rvtab{overflow-x:auto}.rvtab td:nth-child(3){width:104px}
.rvtab h4{margin:0 0 6px;font-size:14px}
.rvtab table{font-size:12.5px}.rvtab td,.rvtab th{padding:5px 4px}.rvtab input{width:100%;text-align:right;padding:4px 6px;font-size:12.5px}
#rvOut input{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.rvtab input.ov{border-color:#2F7BEA;background:rgba(47,123,234,.08)}
.rvtot td{font-weight:700;border-top:1px solid var(--line)}
.rvsec{margin-top:14px}.rvsec h4{margin:0 0 6px;font-size:14px}
.rvaviso{padding:10px 12px;border-radius:8px;background:var(--fc-soft);color:var(--fct);font-size:13px;margin:4px 0 12px}
.rvneg{color:var(--warn)}.rvpos{color:var(--won)}
@media (max-width:900px){.rvctl,.rvcards,.rvmeses{grid-template-columns:1fr 1fr}#rvRegras{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="band"><div class="inner">
  <header class="top">
    <div class="brand">
      <img id="logo" alt="Logo da empresa" src="">
      <span class="div"></span>
      <div>
        <h1>Simulador de remuneração variável</h1>
        <div class="sub">Mesmas fórmulas da planilha do plano · o salário digitado fica só neste navegador e nunca é enviado ao servidor</div>
      </div>
    </div>
    <div class="controls">
      <button class="ghost" id="rvRestaurar" type="button">Restaurar valores do painel</button>
      <a class="upload" href="./" style="text-decoration:none">← Voltar ao painel</a>
    </div>
  </header>
</div></div>
<div class="wrap">
  <p id="rvCarregando" style="color:var(--muted)">Carregando…</p>
  <section class="card hidden" id="rvPage">
    <div class="rvctl">
      <label>Executivo<select id="rvExec"></select></label>
      <label>Trimestre<select id="rvTri"></select></label>
      <label>Cenário<select id="rvCen">
        <option value="real">Só o realizado (ganhas)</option>
        <option value="90">Realizado + previsto com 90%+</option>
        <option value="60">Realizado + previsto com 60%+</option>
        <option value="30">Realizado + previsto com 30%+</option>
        <option value="0">Realizado + todo o previsto</option></select></label>
      <label>Salário fixo mensal<div class="rvfixo"><input id="rvFixo" type="password" inputmode="decimal" autocomplete="off" placeholder="R$ 0,00"><button type="button" id="rvOlho" title="Mostrar/ocultar">👁</button></div></label>
      <label class="rvchk"><input type="checkbox" id="rvLembrar"> Lembrar o salário neste navegador</label>
    </div>
    <details class="rvreg"><summary>Regras do plano (gatilho, teto, pesos e campanhas)</summary><div id="rvRegras"></div></details>
    <div id="rvOut"></div>
  </section>
</div>
<script src="simulador.js"></script>
</body>
</html>
